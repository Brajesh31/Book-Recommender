name: 🧪 Python and documentation quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Syntax and template checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python source
        run: python -m py_compile app.py

      - name: Compile Jinja templates
        run: |
          python - <<'PY'
          from jinja2 import Environment, FileSystemLoader
          env = Environment(loader=FileSystemLoader("templates"))
          for name in env.list_templates():
              env.get_template(name)
              print(f"OK: {name}")
          PY

      - name: Check required documentation files
        run: |
          test -s README.md
          test -s docs/README.md
          test -s SECURITY.md
          test -s CONTRIBUTING.md
          test -s CODE_OF_CONDUCT.md
          test -s docs/architecture.md
          test -s docs/accessibility.md
