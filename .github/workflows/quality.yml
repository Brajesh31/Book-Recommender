name: 🧪 Python and documentation quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Syntax, templates, and template tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile Python source
        run: python -m py_compile app.py tests/test_templates.py tests/test_app.py

      - name: Run template tests
        run: pytest -q

      - name: Compile Jinja templates
        run: |
          python - <<'PY'
          from jinja2 import Environment, FileSystemLoader
          env = Environment(loader=FileSystemLoader("templates"))
          for name in env.list_templates():
              env.get_template(name)
              print(f"OK: {name}")
          PY

      - name: Check required documentation and assets
        run: |
          test -s README.md
          test -s docs/README.md
          test -s SECURITY.md
          test -s CONTRIBUTING.md
          test -s CODE_OF_CONDUCT.md
          test -s docs/architecture.md
          test -s docs/accessibility.md
          test -s assets/diagrams/architecture.svg
          test -s assets/diagrams/recommendation-flow.svg
          test -s assets/diagrams/data-lineage.svg
