name: 📚 Documentation validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "assets/diagrams/**"

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify core documentation and visual assets
        run: |
          test -s README.md
          test -s docs/README.md
          test -s docs/architecture.md
          test -s docs/model-methodology.md
          test -s docs/security.md
          test -s docs/accessibility.md
          test -s assets/diagrams/architecture.svg
          test -s assets/diagrams/recommendation-flow.svg
          test -s assets/diagrams/data-lineage.svg
          echo "Documentation and visual assets are present."
