<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Bookwish system architecture</title><desc id="desc">CSV datasets flow through an offline notebook to pickle artifacts, which are loaded by a Flask server and rendered through Jinja templates to a browser.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#9333ea"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#94a3b8"/></marker></defs><rect width="1080" height="560" rx="24" fill="#0f172a"/><text x="44" y="55" fill="#f8fafc" font-size="28" font-family="Arial" font-weight="700">📚 Bookwish system architecture</text><g font-family="Arial" text-anchor="middle"><rect x="45" y="130" width="210" height="120" rx="16" fill="#1e293b" stroke="#64748b"/><text x="150" y="170" fill="#e2e8f0" font-size="18" font-weight="700">Source datasets</text><text x="150" y="203" fill="#cbd5e1" font-size="14">Books · Ratings · Users</text><rect x="345" y="130" width="210" height="120" rx="16" fill="url(#g)"/><text x="450" y="170" fill="white" font-size="18" font-weight="700">Offline notebook</text><text x="450" y="203" fill="white" font-size="14">Filter · Pivot · Similarity</text><rect x="645" y="110" width="185" height="160" rx="16" fill="#1e293b" stroke="#64748b"/><text x="737" y="150" fill="#e2e8f0" font-size="18" font-weight="700">Pickle artifacts</text><text x="737" y="183" fill="#cbd5e1" font-size="13">popular.pkl</text><text x="737" y="207" fill="#cbd5e1" font-size="13">pt.pkl · books.pkl</text><text x="737" y="231" fill="#cbd5e1" font-size="13">similarity_scores.pkl</text><rect x="645" y="355" width="185" height="110" rx="16" fill="#1e293b" stroke="#64748b"/><text x="737" y="395" fill="#e2e8f0" font-size="18" font-weight="700">Flask app</text><text x="737" y="425" fill="#cbd5e1" font-size="14">Routes · In-memory data</text><rect x="345" y="355" width="210" height="110" rx="16" fill="#1e293b" stroke="#64748b"/><text x="450" y="395" fill="#e2e8f0" font-size="18" font-weight="700">Jinja templates</text><text x="450" y="425" fill="#cbd5e1" font-size="14">index · recommend</text><rect x="45" y="355" width="210" height="110" rx="16" fill="#1e293b" stroke="#64748b"/><text x="150" y="395" fill="#e2e8f0" font-size="18" font-weight="700">Visitor browser</text><text x="150" y="425" fill="#cbd5e1" font-size="14">HTTP · HTML · cover URLs</text></g><g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M255 190H335"/><path d="M555 190H635"/><path d="M737 280V345"/><path d="M635 410H565"/><path d="M335 410H265"/></g><text x="540" y="520" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle">Offline preparation is separate from request-time inference</text></svg>