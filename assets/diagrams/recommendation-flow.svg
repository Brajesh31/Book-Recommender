<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc"><title id="title">Book recommendation flow</title><desc id="desc">Visitor submits a title, Flask performs exact lookup, retrieves a similarity row, ranks candidates, resolves metadata, and renders up to four recommendations.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#94a3b8"/></marker></defs><rect width="1080" height="420" rx="24" fill="#0f172a"/><text x="40" y="55" fill="#f8fafc" font-family="Arial" font-size="27" font-weight="700">🔎 Online recommendation lifecycle</text><g font-family="Arial" text-anchor="middle"><rect x="35" y="145" width="150" height="105" rx="14" fill="#1e293b" stroke="#64748b"/><text x="110" y="185" fill="#e2e8f0" font-size="16" font-weight="700">Visitor</text><text x="110" y="213" fill="#cbd5e1" font-size="13">Submit title</text><rect x="225" y="145" width="150" height="105" rx="14" fill="url(#g)"/><text x="300" y="185" fill="white" font-size="16" font-weight="700">Exact lookup</text><text x="300" y="213" fill="white" font-size="13">pt.index</text><rect x="415" y="145" width="150" height="105" rx="14" fill="#1e293b" stroke="#64748b"/><text x="490" y="185" fill="#e2e8f0" font-size="16" font-weight="700">Similarity row</text><text x="490" y="213" fill="#cbd5e1" font-size="13">score vector</text><rect x="605" y="145" width="150" height="105" rx="14" fill="#1e293b" stroke="#64748b"/><text x="680" y="185" fill="#e2e8f0" font-size="16" font-weight="700">Rank</text><text x="680" y="213" fill="#cbd5e1" font-size="13">Top candidates</text><rect x="795" y="145" width="115" height="105" rx="14" fill="#1e293b" stroke="#64748b"/><text x="852" y="185" fill="#e2e8f0" font-size="16" font-weight="700">Metadata</text><text x="852" y="213" fill="#cbd5e1" font-size="13">books.pkl</text><rect x="945" y="145" width="110" height="105" rx="14" fill="#166534"/><text x="1000" y="185" fill="white" font-size="16" font-weight="700">HTML</text><text x="1000" y="213" fill="white" font-size="13">Up to 4</text></g><g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#m)"><path d="M185 198H215"/><path d="M375 198H405"/><path d="M565 198H595"/><path d="M755 198H785"/><path d="M910 198H935"/></g><rect x="260" y="300" width="560" height="62" rx="12" fill="#3f1d2e" stroke="#fb7185"/><text x="540" y="337" fill="#fecdd3" text-anchor="middle" font-family="Arial" font-size="15">✓ Blank and unknown titles return validation feedback</text></svg>