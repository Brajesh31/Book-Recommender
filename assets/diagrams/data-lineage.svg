<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Bookwish data lineage</title><desc id="desc">Books and ratings inputs, with user data available for exploration, feed a notebook that emits four runtime artifacts consumed by Flask.</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs><rect width="1000" height="500" rx="22" fill="#0f172a"/><text x="38" y="50" fill="#f8fafc" font-family="Arial" font-size="26" font-weight="700">🗃️ Dataset and artifact lineage</text><g font-family="Arial"><g fill="#1e293b" stroke="#64748b"><rect x="45" y="105" width="190" height="62" rx="12"/><rect x="45" y="195" width="190" height="62" rx="12"/><rect x="45" y="285" width="190" height="62" rx="12"/><rect x="390" y="190" width="220" height="90" rx="12"/><rect x="745" y="100" width="200" height="62" rx="12"/><rect x="745" y="180" width="200" height="62" rx="12"/><rect x="745" y="260" width="200" height="62" rx="12"/><rect x="745" y="340" width="200" height="62" rx="12"/></g><g fill="#e2e8f0" font-size="16" font-weight="700"><text x="140" y="143" text-anchor="middle">Books.csv</text><text x="140" y="233" text-anchor="middle">Ratings.csv</text><text x="140" y="323" text-anchor="middle">Users.csv</text><text x="500" y="228" text-anchor="middle">Notebook transforms</text><text x="845" y="138" text-anchor="middle">popular.pkl</text><text x="845" y="218" text-anchor="middle">pt.pkl</text><text x="845" y="298" text-anchor="middle">books.pkl</text><text x="845" y="378" text-anchor="middle">similarity_scores.pkl</text></g><g fill="#94a3b8" font-size="12"><text x="140" y="158" text-anchor="middle">metadata</text><text x="140" y="248" text-anchor="middle">ratings</text><text x="140" y="338" text-anchor="middle">exploration input</text></g></g><g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#