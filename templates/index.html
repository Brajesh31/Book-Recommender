<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse popular books and discover your next read with Bookwish." />
    <title>Popular Books | Bookwish</title>
    <link rel="shortcut icon" href="https://github.com/Brajesh31.png" type="image/x-icon" />
    <link rel="apple-touch-icon" href="https://github.com/Brajesh31.png" />
    <style>
      :root { color-scheme: dark; }
      body { background-color: #1e1e2f; color: #f5f5f5; font-family: Arial, sans-serif; margin: 0; padding: 0; }
      .skip-link { position: absolute; left: -9999px; top: 0; z-index: 10; padding: 12px; background: #fff; color: #111; }
      .skip-link:focus { left: 12px; top: 12px; }
      .navbar { background-color: #6a0dad; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; }
      .navbar-brand { color: #fff; font-size: 24px; text-decoration: none; }
      .nav-links { display: flex; gap: 20px; }
      .nav-links a { color: #fff; text-decoration: none; font-size: 16px; }
      .nav-links a:hover { color: #fff; text-decoration: underline; }
      a:focus-visible, button:focus-visible { outline: 3px solid #ffcf70; outline-offset: 3px; border-radius: 3px; }
      h1 { text-align: center; font-size: 40px; margin: 20px 0; }
      .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
      .card { background-color: #2b2b3c; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); width: 300px; overflow: hidden; text-align: center; }
      .card img { width: 100%; height: 200px; object-fit: contain; background: #202033; }
      .card-body { padding: 15px; }
      .card-body p { font-size: 18px; margin: 10px 0; color: #e0c8ff; }
      .card-body h2 { font-size: 17px; margin: 8px 0; }
      .card-body h3 { font-size: 15px; margin: 8px 0; font-weight: 500; }
      @media (max-width: 768px) { h1 { font-size: 32px; } .container { flex-direction: column; align-items: center; } .card { width: min(90%, 420px); } }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <nav class="navbar" aria-label="Main navigation">
      <a class="navbar-brand" href="/">Bookwish</a>
      <div class="nav-links"><a href="/recommend">Recommend books</a></div>
    </nav>
    <main id="main-content">
      <h1>Top 50 Books</h1>
      <section class="container" aria-label="Popular books">
        {% for i in range(book_name|length) %}
        <article class="card">
          {% if image[i] %}
          <img src="{{ image[i] }}" alt="Cover of {{ book_name[i] }} by {{ author[i] }}" loading="lazy" decoding="async" />
          {% endif %}
          <div class="card-body">
            <p>{{ book_name[i] }}</p>
            <h2>{{ author[i] }}</h2>
            <h3>Ratings: {{ votes[i] }}</h3>
            <h3>Average rating: {{ rating[i] }}</h3>
          </div>
        </article>
        {% endfor %}
      </section>
    </main>
  </body>
</html>
